name: 11 - Working with Inputs

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        default: false
        description: "Skip deployment and only print build output"
      target:
        type: environment
        required: true
        description: "Which environment the workflow will target"
      tag:
        type: choice
        options:
          - v1
          - v2
          - v3
        description: "Release from which to build and deploy"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: |
          echo "Building from tag  ${{ inputs.tag }}"
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !inputs.dry-run }}
    # Should set the environment option to the target input.
    environment: ${{ inputs.target }}
    steps:
      - name: deploy
        run: echo "Deploying to ${{ inputs.target }} environment"


