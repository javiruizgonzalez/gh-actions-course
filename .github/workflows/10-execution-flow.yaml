name: 10 - Controlling the Execution Flow

on:
  push:
  workflow_dispatch:
    inputs:
      pass-unit-tests:
        type: boolean
        default: false

jobs:
  lint-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: "Lint and build"
        run: echo "Linting and building project"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: "Run unit tests"
        run: echo "Running unit tests"
      - name: "Failing tests"
        run: |
          if [ "${{ inputs.pass-unit-tests }}" = "true" ]; then
            echo "Unit tests passed"
          else
            echo "Unit tests failed"
          exit 1
  deploy-nonprod:
    name: Deploy to Non-Prod
    runs-on: ubuntu-latest
    needs: [lint-build, unit-tests]
    steps:
      - name: "Deploy to non-prod"
        run: echo "Deploying to non-prod environment"
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: deploy-nonprod
    steps:
      - name: "Run end-to-end tests"
        run: echo "Running end-to-end tests"
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: deploy-nonprod
    steps:
      - name: "Run load tests"
        run: echo "Running load tests"
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: [e2e-tests, load-tests]
    steps:
      - name: "Deploy to prod"
        run: echo "Deploying to prod environment"