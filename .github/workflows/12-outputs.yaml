name: 12 - Working with Outputs

on:
  workflow_dispatch:
    inputs:
      build-status:
        type: choice
        required: true
        options:
          - success
          - failure
        default: success
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{ steps.build.outputs.status }}
      output1: ${{ steps.build.outputs.value1 }}
      output2: ${{ steps.build.outputs.value2 }}
    steps:
      - name: Print GITHUB_OUTPUT path
        run: echo "GITHUB_OUTPUT is located at $GITHUB_OUTPUT"
      - name: build
        id: build
        run: |
          echo "status=${{ inputs.build-status }}" >> "$GITHUB_OUTPUT"
          echo "value1=This is output value 1" >> "$GITHUB_OUTPUT"
          echo "value2=This is output value 2" >> "$GITHUB_OUTPUT"
          echo "Print value of GITHUB_OUTPUT file:"
          cat "$GITHUB_OUTPUT"
          echo "mistake=true" > "$GITHUB_OUTPUT"
          echo "Print value of GITHUB_OUTPUT file:"
          cat "$GITHUB_OUTPUT"
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.build-status == 'success' }}
    steps:
      - name: deploy
        run: echo "Deploying application since build was successful"